<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiantes para estética tech/SaaS -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo Squircle (App Icon / Favicon) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Órbita del Globo (Concepto Atlas) -->
  <ellipse cx="256" cy="285" rx="160" ry="55" fill="none" stroke="url(#ring-grad)" stroke-width="14" transform="rotate(-18 256 285)" opacity="0.35"/>

  <g filter="url(#subtle-glow)">
    <!-- Pierna izquierda 'A' -->
    <path d="M 256 100 L 136 380 H 198 L 256 235 Z" fill="url(#accent-grad)"/>

    <!-- Pierna derecha 'A' -->
    <path d="M 256 100 L 376 380 H 314 L 256 235 Z" fill="url(#primary-grad)"/>

    <!-- Travesaño dinámico en forma de arco/órbita -->
    <path d="M 152 280 Q 256 220 360 280 Q 256 315 152 280 Z" fill="url(#ring-grad)"/>
  </g>

  <!-- Nodo conector superior (Concepto Punto de Venta / Red) -->
  <circle cx="256" cy="100" r="16" fill="#38BDF8"/>
  <circle cx="256" cy="100" r="7" fill="#FFFFFF"/>
</svg>
